<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Daily Activities To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Student Daily Activities To-Do List</h1>
    
    <!-- Dark Mode Toggle -->
    <button id="toggle-mode">🌙 Dark Mode</button>

    <form id="todo-form">
        <input type="text" id="task" placeholder="Enter activity" required>
        <input type="time" id="time" required>
        <select id="priority" required>
            <option value="" disabled selected>Choose Priority</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
        <button type="submit">Add Activity</button>
    </form>

    <div class="filter">
        <label for="filter">Filter by Priority: </label>
        <select id="filter">
            <option value="All">All</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
    </div>

    <ul id="todo-list"></ul>
    <p id="total-time">Total Estimated Time: 00:00</p>
    <button id="export-pdf">Export as PDF</button>

    <h2>Progress Charts</h2>
    <canvas id="statusChart" width="300" height="200"></canvas>
    <canvas id="priorityChart" width="300" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
